name: Update pinned repos

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned repositories (GraphQL)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -f query='
            query {
              user(login: "asrbmy") {
                pinnedItems(first: 6, types: REPOSITORY) {
                  nodes {
                    ... on Repository {
                      name
                      description
                      url
                      homepageUrl
                      stargazerCount
                      primaryLanguage { name }
                      repositoryTopics(first: 5) { nodes { topic { name } } }
                    }
                  }
                }
              }
            }' > raw.json

          jq '{
            updated: (now | todate),
            repos: [ (.data.user.pinnedItems.nodes // [])[] | {
              name,
              description,
              url,
              homepage: (.homepageUrl // ""),
              stars: .stargazerCount,
              language: (.primaryLanguage.name // ""),
              topics: [ .repositoryTopics.nodes[].topic.name ]
            } ]
          }' raw.json > pinned.json
          rm raw.json
          cat pinned.json
          if [ "$(jq '.repos | length' pinned.json)" = "0" ]; then
            echo "::error::GitHub returned no pinned repositories. Pin some repos on your profile first."; exit 1
          fi

      - name: Commit if changed
        run: |
          # ignore the timestamp when deciding whether anything really changed
          if git diff --quiet HEAD -- pinned.json; then exit 0; fi
          OLD=$(git show HEAD:pinned.json 2>/dev/null | jq -c '.repos' || echo null)
          NEW=$(jq -c '.repos' pinned.json)
          if [ "$OLD" = "$NEW" ]; then git checkout -- pinned.json; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pinned.json
          git commit -m "Update pinned repos"
          git push

      - name: Trigger a Pages rebuild
        # Pushes made with the built-in token do not start a Pages build by themselves.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git log -1 --pretty=%s | grep -q 'Update pinned repos'; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" || echo "Could not trigger a Pages build; run it manually from Settings > Pages."
          fi
